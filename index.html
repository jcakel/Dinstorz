<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Corporativo - DinStorz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #dc2626;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --transition: all 0.2s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Menú Lateral */
        .sidebar { width: 260px; background-color: var(--primary); color: white; padding: 20px 15px; display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; border-right: 1px solid rgba(255,255,255,0.05); }
        .logo-container { display: flex; align-items: center; gap: 10px; padding-bottom: 20px; margin-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo-icon { width: 36px; height: 36px; fill: none; stroke: var(--accent); stroke-width: 2.5; }
        .logo-text { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; color: #ffffff; }
        .logo-text span { color: var(--accent); }
        .sidebar-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 12px; font-weight: 700; padding-left: 10px; }
        .category-menu { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }

        .category-btn { background: none; border: none; color: #94a3b8; padding: 12px 14px; text-align: left; font-size: 0.9rem; font-weight: 500; cursor: pointer; border-radius: var(--radius-md); transition: var(--transition); display: flex; justify-content: space-between; align-items: center; }
        .category-btn:hover { background-color: rgba(255, 255, 255, 0.03); color: #ffffff; }
        .category-btn.active { background-color: var(--accent); color: white; font-weight: 600; box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3); }
        .category-count { font-size: 0.7rem; background-color: rgba(255, 255, 255, 0.15); color: white; padding: 2px 6px; border-radius: 20px; font-weight: 600; }

        /* Contenedor Principal */
        .main-content { margin-left: 260px; flex: 1; padding: 30px; max-width: 1400px; }
        header { background: var(--bg-card); padding: 20px 25px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); margin-bottom: 25px; }
        .header-title h1 { font-size: 1.5rem; color: var(--primary); font-weight: 700; }
        .header-title p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

        /* Buscador */
        .search-container { position: relative; margin-bottom: 25px; width: 100%; }
        .search-input { width: 100%; padding: 14px 20px 14px 50px; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.95rem; color: var(--primary); box-shadow: var(--shadow-sm); outline: none; }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--text-muted); stroke-width: 2; fill: none; }

        /* Grid de Productos */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; transition: var(--transition); cursor: pointer; }
        .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: rgba(220,38,38,0.3); }

        .card-header-img { height: 160px; background: #ffffff; display: flex; justify-content: center; align-items: center; position: relative; border-bottom: 1px solid var(--border-color); padding: 10px; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-badge { position: absolute; top: 10px; left: 10px; background-color: var(--primary-light); color: white; padding: 3px 8px; font-size: 0.7rem; font-weight: 600; border-radius: 20px; z-index: 2; text-transform: uppercase; }
        .card-icon-placeholder { width: 48px; height: 48px; stroke: #cbd5e1; stroke-width: 1.2; fill: none; }

        .card-content { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        
        .product-title { font-size: 1rem; color: var(--primary); font-weight: 700; margin-bottom: 2px; line-height: 1.3; }
        .product-desc { font-size: 0.85rem; color: var(--text-main); font-weight: 400; margin-bottom: 12px; }
        
        .product-specs { background-color: var(--bg-main); padding: 10px; border-radius: var(--radius-md); font-size: 0.8rem; margin-bottom: 15px; display: flex; flex-direction: column; gap: 4px; }
        .spec-item { display: flex; justify-content: space-between; }
        .spec-label { color: var(--text-muted); }
        .spec-value { font-weight: 600; color: var(--primary); text-align: right; max-width: 65%; }
        
        .card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 12px; }
        .product-id { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
        .product-price { font-size: 1.2rem; color: #16a34a; font-weight: 700; }

        /* Modal / Pantalla Completa */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 20px; }
        .modal-content { background: var(--bg-card); width: 100%; max-width: 900px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); position: relative; overflow: hidden; display: flex; flex-direction: column; max-height: 90vh; animation: modalFadeIn 0.3s ease; }
        @keyframes modalFadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 768px) { .modal-content { flex-direction: row; } }
        .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.05); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 1.5rem; transition: 0.2s; color: var(--text-main); }
        .modal-close:hover { background: var(--accent); color: white; }
        .modal-img-container { flex: 1; background: #ffffff; display: flex; justify-content: center; align-items: center; padding: 30px; border-bottom: 1px solid var(--border-color); min-height: 300px; }
        @media (min-width: 768px) { .modal-img-container { border-bottom: none; border-right: 1px solid var(--border-color); width: 50%; } }
        .modal-img { max-width: 100%; max-height: 400px; object-fit: contain; }
        .modal-info { flex: 1; padding: 40px 30px; overflow-y: auto; display: flex; flex-direction: column; }
        .modal-title { font-size: 1.5rem; color: var(--primary); font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
        .modal-desc { font-size: 1.1rem; color: var(--text-main); margin-bottom: 25px; line-height: 1.5; }
        .modal-specs { background: var(--bg-main); padding: 20px; border-radius: var(--radius-md); font-size: 1rem; margin-bottom: 30px; display: flex; flex-direction: column; gap: 12px; }
        .modal-spec-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 8px; }
        .modal-spec-item:last-child { border-bottom: none; padding-bottom: 0; }
        .modal-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .modal-id { font-size: 1rem; font-weight: 700; color: var(--text-muted); background: #f1f5f9; padding: 6px 12px; border-radius: 6px; }
        .modal-price { font-size: 2rem; color: #16a34a; font-weight: 700; }

        /* Loading & Errors */
        .loading-container, .no-results { grid-column: 1 / -1; text-align: center; padding: 50px 15px; color: var(--text-muted); background: var(--bg-card); border-radius: var(--radius-lg); border: 1px dashed var(--border-color); }
        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 30px; height: 30px; border-radius: 50%; border-left-color: var(--accent); animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Adaptación a Tablets */
        @media (max-width: 1024px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; padding: 15px; }
            .logo-container { margin-bottom: 10px; padding-bottom: 10px; }
            .main-content { margin-left: 0; padding: 15px; }
        }

        /* VISTA CELULAR */
        @media (max-width: 600px) {
            .category-menu { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 6px; padding-bottom: 10px; overflow: visible; }
            .category-btn { flex: 1 1 calc(50% - 6px); justify-content: center; text-align: center; padding: 10px 8px; font-size: 0.8rem; flex-direction: column; gap: 4px; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            header { padding: 15px; margin-bottom: 15px; }
            .header-title h1 { font-size: 1.15rem; }
            .header-title p { font-size: 0.75rem; }
            .search-container { margin-bottom: 20px; }
            .search-input { padding: 12px 15px 12px 40px; font-size: 0.85rem; }
            .search-icon { left: 12px; width: 16px; height: 16px; }
            .card-header-img { height: 110px; padding: 5px; }
            .card-badge { top: 5px; left: 5px; padding: 2px 6px; font-size: 0.6rem; }
            .card-icon-placeholder { width: 36px; height: 36px; }
            .card-content { padding: 10px; }
            .product-title { font-size: 0.85rem; margin-bottom: 2px; }
            .product-desc { font-size: 0.75rem; margin-bottom: 8px; }
            .product-specs { padding: 6px; font-size: 0.65rem; margin-bottom: 10px; gap: 2px; }
            .spec-item { flex-direction: column; align-items: flex-start; } 
            .spec-value { max-width: 100%; text-align: left; font-size: 0.7rem; }
            .card-footer { flex-direction: column; align-items: flex-start; gap: 6px; padding-top: 8px; }
            .product-id { font-size: 0.65rem; }
            .product-price { font-size: 1rem; }
            
            /* Ajustes del modal en celular */
            .modal-content { max-height: 95vh; }
            .modal-img-container { min-height: 200px; padding: 15px; }
            .modal-info { padding: 20px; }
            .modal-title { font-size: 1.2rem; }
            .modal-desc { font-size: 0.95rem; }
            .modal-specs { font-size: 0.85rem; padding: 15px; }
            .modal-price { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo-container">
            <svg class="logo-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 3 v3M12 18 v3M3 12 h3M18 12 h3"></path></svg>
            <div class="logo-text">Din<span>Storz</span></div>
        </div>
        <div class="sidebar-title">Líneas de Producto</div>
        
        <div class="category-menu" id="categoryMenu"></div>
    </div>

    <div class="main-content">
        <header>
            <div class="header-title">
                <h1>Catálogo Técnico Hidráulico</h1>
                <p>Material de Ingeniería Contra Incendios y Conexiones Normadas</p>
            </div>
        </header>

        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar por ID, nombre o medida..." oninput="searchProducts()" disabled>
        </div>

        <div class="products-grid" id="productsGrid">
            <div class="loading-container">
                <div class="spinner"></div>
                <h3>Sincronizando base de datos...</h3>
                <p style="font-size: 0.85rem;">Descargando información desde Google Sheets.</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="productModal" onclick="cerrarModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="cerrarModal(event)">×</button>
            <div class="modal-img-container" id="modalImgContainer"></div>
            <div class="modal-info">
                <div class="modal-title" id="modalTitle"></div>
                <div class="modal-desc" id="modalDesc"></div>
                
                <div class="modal-specs">
                    <div class="modal-spec-item"><span class="spec-label">Acople:</span><span class="spec-value" id="modalAcople"></span></div>
                    <div class="modal-spec-item"><span class="spec-label">Medida:</span><span class="spec-value" id="modalMedida"></span></div>
                    <div class="modal-spec-item"><span class="spec-label">Material:</span><span class="spec-value" id="modalMaterial"></span></div>
                </div>
                
                <div class="modal-footer">
                    <span class="modal-id" id="modalId"></span>
                    <span class="modal-price" id="modalPrice"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG_SHEET_ID = '16Oe7UJWugP_U0v2oawstd94AzgH0cjeffirfz-HXYlo'; 
        let productos = [];
        let currentCategory = ''; 
        let categoriasUnicas = [];

        function cleanString(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/[áäâà]/g, 'a').replace(/[éëêè]/g, 'e').replace(/[íïîì]/g, 'i').replace(/[óöôò]/g, 'o').replace(/[úüûù]/g, 'u').replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function procesarDatosSheets(data) {
            try {
                if (!data || !data.table || !data.table.cols) throw new Error("Google devolvió la estructura de tabla vacía.");

                let headers = data.table.cols.map(col => col.label ? cleanString(col.label) : '');
                let rows = data.table.rows || [];

                if ((headers.length === 0 || headers.every(h => h === '')) && rows.length > 0) {
                    if (rows[0] && rows[0].c) {
                        headers = rows[0].c.map(cell => cell && cell.v !== null ? cleanString(String(cell.v)) : '');
                        rows = rows.slice(1); 
                    }
                }

                const idxId = headers.findIndex(h => h === 'id' || h.startsWith('id') || h.includes('codigo'));
                const idxCategoria = headers.findIndex(h => h.includes('cat'));
                
                // Corrección de índices para que no se pisen entre técnico y comercial
                const idxNombreTecnico = headers.findIndex(h => h.includes('tecnico'));
                const idxDescComercial = headers.findIndex((h, i) => i !== idxNombreTecnico && (h.includes('comercial') || h.includes('descripcion') || h.includes('español') || h.includes('castellano') || h === 'nombre'));
                
                const idxAcople = headers.findIndex(h => h.includes('acople') || h.includes('ka') || h.includes('storz'));
                const idxMedida = headers.findIndex(h => h.includes('medida') || h.includes('nominal'));
                const idxMaterial = headers.findIndex(h => h.includes('material'));
                const idxPrecio = headers.findIndex(h => h.includes('precio') || h.includes('clp') || h.includes('lista') || h.includes('venta'));
                const idxFoto = headers.findIndex(h => h.includes('foto') || h.includes('drive') || h.includes('enlace'));

                productos = rows.map(row => {
                    const c = row.c;
                    const getValRaw = (idx) => (idx !== -1 && c && c[idx] && c[idx].v !== null && c[idx].v !== undefined) ? String(c[idx].v) : '';
                    const getVal = (idx) => getValRaw(idx).trim();
                    const getNum = (idx) => {
                        if (idx === -1 || !c || !c[idx] || c[idx].v === null || c[idx].v === undefined) return 0;
                        let val = c[idx].v;
                        if (typeof val === 'number') return val;
                        let str = String(val).trim().replace(/\$/g, '');
                        if (str.includes('.') && !str.includes(',')) str = str.replace(/\./g, '');
                        else if (str.includes(',') && str.includes('.')) str = str.replace(/\./g, '').replace(/,/g, '.');
                        else if (str.includes(',') && !str.includes('.')) str = str.replace(/,/g, '.');
                        let parsed = Number(str);
                        return isNaN(parsed) ? 0 : parsed;
                    };

                    let catNameRaw = getValRaw(idxCategoria);
                    let catName = catNameRaw ? catNameRaw.trim() : 'Otros';

                    let tituloFinal = getVal(idxDescComercial) || 'Sin descripción';
                    let techFinal = getVal(idxNombreTecnico) || 'Sin nombre técnico';

                    return {
                        id: getVal(idxId), 
                        categoria: catName, 
                        nombreComercial: tituloFinal, 
                        nombreTecnico: techFinal,
                        acople: getVal(idxAcople) || 'N/A', 
                        medida: getVal(idxMedida) || 'N/A', 
                        material: getVal(idxMaterial) || 'N/A',
                        precio: getNum(idxPrecio), 
                        foto: getVal(idxFoto)
                    };
                }).filter(p => p.id && p.id !== '');

                if (productos.length === 0) throw new Error("Estructura conectada pero sin filas de productos válidos.");

                categoriasUnicas = [...new Set(productos.map(p => p.categoria))];
                if (categoriasUnicas.length > 0) {
                    currentCategory = categoriasUnicas[0];
                }

                document.getElementById('searchInput').disabled = false;
                renderCategoryMenu();
                executeFiltering();

            } catch (error) { showErrorMessage(error.message); }
        }

        function renderCategoryMenu() {
            const menu = document.getElementById('categoryMenu');
            menu.innerHTML = '';
            
            categoriasUnicas.forEach(cat => {
                const count = productos.filter(p => p.categoria === cat).length;
                const btn = document.createElement('button');
                btn.className = `category-btn ${cat === currentCategory ? 'active' : ''}`;
                btn.onclick = function() { filterCategory(cat, this); };
                btn.innerHTML = `${cat} <span class="category-count">${count}</span>`;
                menu.appendChild(btn);
            });
        }

        function showErrorMessage(detalleError) {
            document.getElementById('productsGrid').innerHTML = `
                <div class="no-results" style="border-color: var(--accent); padding: 30px 15px;">
                    <h3 style="color: var(--accent); font-size: 1.2rem; margin-bottom: 10px;">⚠️ Error de Lectura</h3>
                    <p style="font-size: 0.9rem; color: var(--primary);">Revisa que los encabezados de la fila 1 estén bien escritos.</p>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 10px;">Detalle: ${detalleError}</p>
                </div>`;
        }

        function iniciarSincronizacion() {
            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${CONFIG_SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:procesarDatosSheets`;
            script.onerror = () => showErrorMessage("Conexión bloqueada por el navegador o red local.");
            document.body.appendChild(script);
            setTimeout(() => { if (productos.length === 0) showErrorMessage("Tiempo de espera agotado."); }, 8000);
        }

        function formatPrice(value) {
            if (isNaN(value) || value === 0) return 'Consultar';
            return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', minimumFractionDigits: 0 }).format(value);
        }

        function optimizarEnlaceDrive(url) {
            if (!url || !url.includes('drive.google.com')) return url || '';
            let id = '';
            const matchD = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            const matchId = url.match(/[?&]id=([a-zA-Z0-9-_]+)/);
            if (matchD) id = matchD[1]; else if (matchId) id = matchId[1];
            return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w400` : url;
        }

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if (items.length === 0) {
                grid.innerHTML = `<div class="no-results"><h3>Sin resultados</h3></div>`;
                return;
            }

            items.forEach((prod) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => abrirModal(prod.id);
                
                const enlaceOptimizado = optimizarEnlaceDrive(prod.foto);
                const imagenHTML = enlaceOptimizado ? `
                    <img src="${enlaceOptimizado}" alt="${prod.nombreTecnico}" class="product-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <svg class="card-icon-placeholder" style="display:none;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 3 v3M12 18 v3M3 12 h3M18 12 h3"></path></svg>
                ` : `<svg class="card-icon-placeholder" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 3 v3M12 18 v3M3 12 h3M18 12 h3"></path></svg>`;

                card.innerHTML = `
                    <div class="card-header-img"><span class="card-badge">${prod.categoria}</span>${imagenHTML}</div>
                    <div class="card-content">
                        <div>
                            <div class="product-title">${prod.nombreTecnico}</div>
                            <div class="product-desc">${prod.nombreComercial}</div>
                            
                            <div class="product-specs">
                                <div class="spec-item"><span class="spec-label">Acople:</span><span class="spec-value">${prod.acople}</span></div>
                                <div class="spec-item"><span class="spec-label">Medida:</span><span class="spec-value">${prod.medida}</span></div>
                                <div class="spec-item"><span class="spec-label">Material:</span><span class="spec-value">${prod.material}</span></div>
                            </div>
                        </div>
                        <div class="card-footer"><span class="product-id">${prod.id}</span><span class="product-price">${formatPrice(prod.precio)}</span></div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        // Lógica del Modal
        function abrirModal(id) {
            const prod = productos.find(p => p.id === id);
            if (!prod) return;

            const enlaceOptimizado = optimizarEnlaceDrive(prod.foto);
            const imagenHTML = enlaceOptimizado ? `<img src="${enlaceOptimizado}" class="modal-img">` : `<svg class="card-icon-placeholder" style="width:100px;height:100px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 3 v3M12 18 v3M3 12 h3M18 12 h3"></path></svg>`;

            document.getElementById('modalTitle').innerText = prod.nombreTecnico;
            document.getElementById('modalDesc').innerText = prod.nombreComercial;
            document.getElementById('modalImgContainer').innerHTML = imagenHTML;
            document.getElementById('modalAcople').innerText = prod.acople;
            document.getElementById('modalMedida').innerText = prod.medida;
            document.getElementById('modalMaterial').innerText = prod.material;
            document.getElementById('modalId').innerText = prod.id;
            document.getElementById('modalPrice').innerText = formatPrice(prod.precio);

            document.getElementById('productModal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Evita que el fondo haga scroll
        }

        function cerrarModal(e) {
            if (e) e.stopPropagation();
            document.getElementById('productModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Restaura el scroll
        }

        function filterCategory(category, buttonElement) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            document.getElementById('searchInput').value = '';
            executeFiltering();
        }

        function searchProducts() { executeFiltering(); }

        function executeFiltering() {
            const searchText = cleanString(document.getElementById('searchInput').value);
            let filtered = productos;
            
            filtered = filtered.filter(p => p.categoria === currentCategory);
            
            if (searchText !== '') {
                filtered = filtered.filter(p => cleanString(p.nombreComercial).includes(searchText) || cleanString(p.nombreTecnico).includes(searchText) || cleanString(p.id).includes(searchText));
            }
            renderProducts(filtered);
        }

        iniciarSincronizacion();
    </script>
</body>
</html>
